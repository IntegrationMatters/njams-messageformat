name: Build nJAMS messageformat

on:
  push:
    branches:
      - master
      - '[0-9]*.[0-9]*.[xX]'
  pull_request:
    branches:
      - master
      - '[0-9]*.[0-9]*.[xX]'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          # settings.xml entry for the pom's snapshot repository. The *-env-var
          # inputs take variable names, not values; Maven resolves them in the step that sets them.
          server-id: njams-repository-snapshots
          server-username-env-var: NJAMS_REPOSITORY_USER
          server-password-env-var: NJAMS_REPOSITORY_TOKEN

      - name: Build and test
        run: mvn -B clean verify

      - name: Verify JavaDoc
        run: mvn -B generate-sources javadoc:javadoc

      # Pull requests never deploy, so a PR from a fork never sees the repository token. Only snapshots are
      # deployed here: release versions (e.g. the release plugin's release commit) are published by release.yml.
      - name: Deploy snapshot
        if: github.event_name != 'pull_request'
        env:
          NJAMS_REPOSITORY_USER: ci
          NJAMS_REPOSITORY_TOKEN: ${{ secrets.REPOSILITE_CI_TOKEN }}
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$version" != *-SNAPSHOT ]]; then
            echo "::notice::Version $version is not a snapshot; deployment skipped."
            exit 0
          fi
          mvn -B deploy -DskipTests
